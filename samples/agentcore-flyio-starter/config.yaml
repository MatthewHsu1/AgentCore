# The smallest document that runs a real call. Edit the instructions, keep the shape.
#
# src/AgentCore.Api/config/example.yaml in the AgentCore repository is the annotated tour of every
# key, including knowledge, tools, evaluation, and telemetry. This file is the starting point, not
# the reference.

apiVersion: agentcore/v1
name: my-voice-agent

fallbackReply: "I am sorry. I could not finish that. Please say it again."
refusalReply: "I am sorry. I cannot help with that request."

# The typed facts the guards read. The extractor fills them from the finished turn.
state:
  callerSaidGoodbye:   { type: boolean, default: false, writer: extractor }
  callerAskedForHuman: { type: boolean, default: false, writer: extractor }
  resolved:            { type: boolean, default: false, writer: extractor }

extractor:
  model: { ref: fill }
  when: after_reply

# Check 5 evaluates the exits of one stage as siblings, and two true at the same time stops the
# host at startup. One exit needs one guard that covers every way the stage can end.
guards:
  done:
    or:
      - { var: callerSaidGoodbye }
      - { var: callerAskedForHuman }
      - { var: resolved }

agents:
  defaults:
    model: { ref: reply, temperature: 0.3 }
    # The cached prefix. Everything that never changes between turns belongs here.
    instructions: |
      You answer the phone for Example Company.
      Be brief. One or two sentences per turn, because the caller hears this out loud.
      Never invent an order number, a price, or a delivery date.
  items:
    - id: greeter
      instructions: "Greet the caller and ask what they need."
      tools: []
    - id: helper
      instructions: "Answer the caller's question. Offer a human when you cannot."
      tools: []
    - id: closer
      instructions: "Thank the caller and say goodbye."
      tools: []

policy:
  initial: greeting
  stages:
    - id: greeting
      agent: greeter
      to: [ { stage: help } ]

    - id: help
      agent: helper
      to:
        - { stage: close, when: done }

    - id: close
      agent: closer
      terminal: true

providers:
  llm:
    - { kind: openai, model: gpt-4.1-mini, as: reply }
    - { kind: openai, model: gpt-5.4-nano, as: fill }

  call:      { kind: telnyx-relay }
  speech:
    stt: { kind: telnyx-relay }
    tts: { kind: telnyx-relay }
  telephony: { kind: telnyx }

  # Reads what the caller said before the model runs. Delete this line to moderate nothing.
  moderation: { kind: openai }
