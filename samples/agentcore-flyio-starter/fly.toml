# Copy this file and config.yaml into an empty repository of your own. Nothing else is needed.
#
# Change `app`, `primary_region`, and the image tag. Everything below that is a working default.

app = "my-voice-agent"
primary_region = "iad"

# No Dockerfile and no source: Fly pulls the published image. Pin an exact version. A floating tag
# means a redeploy can change what answers the phone with no diff to point at.
[build]
  image = "ghcr.io/exmaple"

# The configuration document, copied off this machine at deploy time into the container filesystem.
# It is not a secret and it belongs in version control beside this file.
[[files]]
  guest_path = "/app/config/config.yaml"
  local_path = "config.yaml"

[env]
  AgentCore__ConfigurationPath = "/app/config/config.yaml"

[http_service]
  internal_port = 8080
  force_https = true

  # A stopped machine has to cold-start before it can answer, and an inbound phone call will not
  # wait. This is the setting that costs money and the one you must not turn off.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_options]
    # The call vendor opens a WebSocket to /v1/call and holds it for the length of the call. The
    # 60-second default closes it under a caller who is still talking.
    idle_timeout = 900

  [[http_service.checks]]
    path = "/health"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
