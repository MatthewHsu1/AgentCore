# AgentCore configuration: the worked example.
#
# WHAT THIS FILE IS
#   One document that shows every section of the schema. It parses, and it passes every startup
#   check. Your real config.yaml lives in your own project. It is not committed here.
#   The same document loads identically as YAML and as JSON.
#
# HOW TO READ IT
#   - Every key has its comment ABOVE it.
#   - The first line of a comment says what the key does.
#   - "Optional" or "Required", and "Default:", follow when they apply.
#   - A key written as "# key: value" is a shape this example does not use. Uncomment it to use it.
#   - ${secret:name} is a reference to a secret, never a value. ISecretResolverPort resolves it at
#     startup.
#
# SECTIONS
#   1. document     apiVersion, fallbackReply, refusalReply
#   2. state        typed slots the guards read
#   3. extractor    the model call that fills the extractor slots
#   4. guards       named JSONLogic rules the stage machine tests
#   5. tools        what an agent may call
#   6. agents       models, prompts, knowledge
#   7. entries      what a caller reaches: a stage machine or one agent
#   8. providers    adapters: llm, conversation, speech, moderation, embeddings, knowledge,
#                   telemetry
#   9. evaluation   the judge that scores finished turns


# =============================================================================================
# 1. document
# =============================================================================================

# The schema version. Required. agentcore/v1 is the only value this release accepts.
apiVersion: agentcore/v1

# What the caller hears when a turn fails. Two failures reach it: a run that returns no text
# after 40 tool rounds, and a tool that fails four times in a row. Every entry speaks this line.
# An entry may override it with its own fallbackReply: (see 7. entries).
# Optional. Default: the value shown. Blank is a load error, because blank is silence on a conversation.
fallbackReply: "I am sorry. I could not finish that. Please say it again."

# What the caller hears when moderation flags their input and the agent refuses the turn.
# This is a separate line on purpose: fallbackReply asks the caller to say it again, and after
# a refusal that would invite the harmful request a second time.
# Optional. Default: the value shown. Blank is a load error.
refusalReply: "I am sorry. I cannot help with that request."


# =============================================================================================
# 2. state: typed slots the guards read
# =============================================================================================
#
# Every slot has exactly one writer:
#   extractor   a model call fills it from the finished turn (see 3. extractor)
#   tool        a named field of a named tool result fills it
#   counter     it adds one whenever its increment: rule is true
#
# Three slots are reserved, always present, and read-only: stage, turnIndex, and
# conversationDurationSeconds. A rule may read them. Do not declare them here.
state:
  # writer: extractor. Nullable on the wire. A null leaves the slot at its previous value.
  callerAskedForHuman: { type: boolean, default: false, writer: extractor }
  callerSaidGoodbye:   { type: boolean, default: false, writer: extractor }
  machineIdentified:   { type: boolean, default: false, writer: extractor }
  resolved:            { type: boolean, default: false, writer: extractor }

  # writer: tool. from: is <tool id>.<result field>. Startup checks that the tool id exists. A
  # tool result has no declared shape, so the field is not checked. The value is coerced to
  # type:. A value that will not coerce leaves the slot at its default.
  orderStatus:         { type: string,  writer: tool, from: lookup_order.status }

  # Knowledge facets. providers.knowledge.scope.fromState names these two, and that turns them
  # into the turn's knowledge scope. A fromState slot must have exactly this shape:
  # writer: extractor, type: string, an enum:, and no default. Startup names the missing piece.
  #
  # enum: is enforced on every write. A value outside it is refused, and the slot keeps its
  # previous value.
  #
  # The slot name IS the facet key, and scope.template turns it into the payload path. So spell
  # it the way the collection spells it (applies_to), not the way this file spells its own keys.
  brand:      { type: string, writer: extractor, description: "The brand of the caller's machine.", enum: [sole, spirit] }
  applies_to: { type: string, writer: extractor, description: "The model, as printed on the machine.", enum: [f63, f65, f80] }

  # writer: counter. Adds one whenever increment: is true.
  failedResolveTurns:
    type: integer
    default: 0
    writer: counter
    increment:
      and:
        - { "===": [ { var: stage }, "resolve" ] }
        - { "!": { var: resolved } }


# =============================================================================================
# 3. extractor: the model call that fills the extractor slots
# =============================================================================================
#
# AgentCore builds one JSON Schema from every writer: extractor slot, all nullable, and asks the
# model to fill what the turn shows. The extractor never speaks, holds no tools, and decides
# nothing. The guards decide.
extractor:
  # The model to call. ref: names a providers.llm[].as value.
  model: { ref: fill }

  # When it runs. after_reply is the only value agentcore/v1 defines: the reply streams first,
  # the turn ends, and the extractor runs while the caller speaks.
  when: after_reply


# =============================================================================================
# 4. guards: named JSONLogic rules
# =============================================================================================
#
# A stage exit names a guard by its key (see 7. entries). A named guard renders by name in the
# live diagram. An inline rule renders as a blob.
# Startup enforces an operator allow-list. Use ===, never ==.
guards:
  saidGoodbye:
    { var: callerSaidGoodbye }

  wantsHuman:
    and:
      - { "!": { var: callerSaidGoodbye } }
      - { var: callerAskedForHuman }

  identified:
    and:
      - { "!": { var: callerSaidGoodbye } }
      - { "!": { var: callerAskedForHuman } }
      - { var: machineIdentified }

  goodbyeOrFixed:
    or:
      - { var: callerSaidGoodbye }
      - and:
          - { "!": { var: callerAskedForHuman } }
          - { var: resolved }

  humanOrExhausted:
    and:
      - { "!": { var: callerSaidGoodbye } }
      - or:
          - { var: callerAskedForHuman }
          - and:
              - { "!": { var: resolved } }
              - { ">=": [ { var: failedResolveTurns }, 3 ] }


# =============================================================================================
# 5. tools: what an agent may call
# =============================================================================================
#
# Four kinds:
#   http      one HTTP call.            request: describes it.
#   binding   a host delegate.          binds: names it.
#   builtin   a tool AgentCore ships.   uses: names it.
#   agent     another declared agent.   agent: names it.
#
# Every tool has an id:. An agent lists tool ids in its tools: (see 6. agents).
# A builtin tool returns an error result. It does not throw.
tools:
  # kind: http
  - id: lookup_order
    kind: http
    description: Read one order by its identifier.
    # The JSON Schema of the arguments. AgentCore passes it to the model unchanged.
    parameters:
      type: object
      properties: { orderId: { type: string } }
      required: [ orderId ]
    request:
      method: GET
      # A {name} placeholder takes its value from the tool arguments.
      url: "https://api.example.com/orders/{orderId}"
      headers: { Authorization: "Bearer ${secret:orders-api-key}" }

  # kind: binding, JSON form. The host registered
  #   options.Bind("CreateCase", (json, ct) => ...)
  # The host reads the arguments as one JSON object, so this declaration writes parameters:.
  - id: create_case
    kind: binding
    binds: CreateCase
    description: Open a service case for a human agent.
    parameters:
      type: object
      properties: { summary: { type: string } }
      required: [ summary ]

  # kind: builtin. These are markers, not code. Each tells the model provider it may run a hosted
  # tool. A provider that does not run it ignores it. AgentToolCompiler drops the marker for a
  # model vetoed with webSearch: false (see 8. providers). That is a warning at compile time,
  # never a boot failure.
  - { id: search, kind: builtin, uses: web.search }

  # kind: builtin, a plain function. The model calls it when a file in the conversation's workspace is a
  # deliverable: the file is copied into providers.blobs (see 8. providers), owned by the conversation,
  # and the person gets a link. Files not published are lost when the conversation ends. Needs
  # providers.blobs and options.UseWorkspace(...) on the host; missing either fails the boot.
  - { id: publish, kind: builtin, uses: file.publish }

  # kind: binding, typed form. Not used in this example. The host registered
  #   options.Bind("CloseCase", (string caseId, string reason) => ...)
  # The method parameters ARE the schema, so write no parameters: here. Writing one is a boot
  # failure. A [Description] attribute on a parameter is what the model reads about it.
  #
  # - id: close_case
  #   kind: binding
  #   binds: CloseCase
  #   description: Close a service case once the customer is happy.

  # kind: agent. Not used in this example. This is agent-as-tool: the outer agent calls the inner
  # agent, reads the reply, and keeps control. It is not a handoff. A handoff transfers control,
  # and that is graph: with pattern: handoff. The inner agent is the same process singleton every
  # other caller shares.
  # The model reads description: and parameters: to decide when to delegate. The filled arguments
  # reach the inner agent as one JSON object. Startup rejects a delegation cycle.
  #
  # - id: ask_specialist
  #   kind: agent
  #   agent: resolver
  #   description: Ask the resolution specialist to answer one product question.
  #   parameters:
  #     type: object
  #     properties: { question: { type: string } }
  #     required: [ question ]


# =============================================================================================
# 6. agents: models, prompts, knowledge
# =============================================================================================
#
# defaults: applies to every item. An item overrides a key by declaring it.
#
# defaults.instructions is the cached prompt prefix. Anything that changes per turn must sit
# below it, or it defeats the cache for every later turn. A cache miss costs money, not capacity:
# a cached prompt still counts in full against the rate limit.
agents:
  defaults:
    # ref: names a providers.llm[].as value.
    model: { ref: reply, temperature: 0.3 }

    # The stable, cached prefix: persona, safety, transfer rules, and tool etiquette.
    instructions: |
      <the stable cached prefix: persona, safety, transfer rules, and tool etiquette>

    # Two posture switches. Both default to true. Set them here for every agent, or on one item.
    #   baseInstructions   puts the framework's base prompt above the prefix: resolve before you
    #                      ask, own what you cannot do, do not repeat a failed call, finish. It
    #                      names no persona and yields to everything below it.
    #   clock              tells the model the date, time, and zone once per turn, as a message
    #                      below the cached prefix. The zone is the server's, unless the request
    #                      carries X-AgentCore-Time-Zone with the browser's IANA id.
    # Turn either off only for an agent whose prompt is measured byte for byte.
    # baseInstructions: true
    # clock: true

    # How an agent reads the knowledge store (providers.knowledge).
    #   mode        prefetch: search before the model runs and inject the cards. One round trip.
    #               tool: give the model a search function and let it decide.
    #   limit       cards per search. Maximum 20.
    #   citations   the model sees the source label. Default: false.
    #   scoped      searches are confined to the turn's facets. Default: true.
    # A forgotten flag is silent and safe. The dangerous direction is the one you type on purpose.
    #
    # scoped: true is why providers.knowledge.scope.template is required. It also means the HOST
    # must open a KnowledgeScope for the turn. AgentCore opens none. A scoped agent with no scope
    # open says it cannot look the answer up. Set scoped: false on an agent that must read the
    # whole corpus.
    knowledge: { mode: prefetch, limit: 5, citations: false }

  items:
    # Voice, scripted. One round trip, no source labels spoken. Inherit knowledge from defaults.
    - { id: greeter,    instructions: "<stage delta>", tools: [] }
    - { id: identifier, instructions: "<stage delta>", tools: [ lookup_order ] }
    - { id: resolver,   instructions: "<stage delta>", tools: [] }
    - { id: escalator,  instructions: "<stage delta>", tools: [ create_case ] }
    - { id: closer,     instructions: "<stage delta>", tools: [] }

    # Internal. Everything on. scoped: false searches every product on purpose.
    - { id: analyst, instructions: "<stage delta>", tools: [ lookup_order, create_case, search, publish ],
        knowledge: { mode: tool, limit: 8, citations: true, scoped: false } }

    # Customer facing. Tools yes, citations no. Sets two keys and inherits limit: 5.
    - { id: webchat, instructions: "<stage delta>", tools: [ lookup_order ],
        knowledge: { mode: tool, citations: false } }


# =============================================================================================
# 7. entries: what a caller reaches
# =============================================================================================
#
# The entry key is the agent's public name. It is the {entry} in /v1/{entry}/call. There is no
# root name: key.
#
# Each entry holds exactly one shape:
#   agent:    one agents.items id, run directly
#   policy:   a stage machine. Each stage names one agent.
#   graph:    not shown here
# plus optional fallbackReply: and refusalReply: overrides.
#
# Stage machine rules. Each turn the machine picks a stage, and the stage names the agent. After
# the turn, the exits (to:) of the current stage are tested as siblings:
#   zero true   the stage stays. This is normal. Set onNoMatch: error on a stage to reject it.
#   one true    move to that stage.
#   two true    a startup error.
# An exit with no when: always fires.
entries:
  phone:
    # Overrides the root fallbackReply for this entry.
    fallbackReply: "Sorry — say it again."
    policy:
      initial: greeting
      stages:
        - id: greeting
          agent: greeter
          to: [ { stage: identify } ]

        - id: identify
          agent: identifier
          to:
            - { stage: close,    when: saidGoodbye }
            - { stage: escalate, when: wantsHuman }
            - { stage: resolve,  when: identified }

        - id: resolve
          agent: resolver
          to:
            - { stage: close,    when: goodbyeOrFixed }
            - { stage: escalate, when: humanOrExhausted }

        - id: escalate
          agent: escalator
          to: [ { stage: close } ]

        - id: close
          agent: closer
          terminal: true

  chat:
    # One agents.items id, run directly. No stage machine.
    agent: webchat
    # Overrides the root refusalReply for this entry.
    refusalReply: "Sorry — I can't help with that here."


# =============================================================================================
# 8. providers: adapters
# =============================================================================================
#
# This section binds adapters to ports. It never changes agent shape.
providers:
  # The models. as: is the name every model: { ref: ... } in this file points at.
  # webSearch: false is a veto, not a default. Omitted or true both leave the choice to the
  # vendor's adapter. cheap is the least capable model, so vetoing it there costs nothing and
  # stops a future hosted tool from running on it by accident.
  llm:
    - { kind: openai, model: gpt-4.1-mini, as: reply }      # the voice path, chosen on latency
    - { kind: openai, model: gpt-5.4-nano, as: fill }       # the extractor, chosen on null discipline
    - { kind: openai, model: gpt-4.1,      as: judge }      # evaluation only, chosen on judgement
    - { kind: openai, model: gpt-4.1-nano, as: cheap, webSearch: false }

  # Two voice planes. They are not duplicates.
  #   conversation the media pipe. It carries the audio and owns the route /v1/{entry}/call.
  #   speech      recognition (stt) and synthesis (tts), one role at a time.
  conversation:      { kind: telnyx-relay }
  speech:
    stt: { kind: telnyx-relay }            # bundled with the relay, so it matches conversation
    tts: { kind: telnyx-relay }            # bundled with the relay, so it matches conversation

  # Reads what the CALLER said, before the model runs. A flagged turn never reaches the model and
  # speaks refusalReply instead. Reads the openai-api-key secret, the same one llm reads.
  # Optional. Remove the line to moderate nothing. The adapter is then never built.
  moderation: { kind: openai }

  # The model that turns a query into a vector. It MUST be the model the collection was built
  # with, or the startup width check refuses to open the store. Reads the openai-api-key secret.
  # dimensions: is optional. Write it only if your ingester asked for a narrower vector than the
  # model's own width.
  embeddings: { kind: openai, model: text-embedding-3-small }

  # Where a file the model publishes (file.publish) is kept after the conversation, owned by the conversation id.
  # Any S3-compatible store. Reads the s3-access-key and s3-secret-key secrets.
  blobs: { kind: s3, endpoint: https://s3.us-east-005.backblazeb2.com, bucket: agentcore-files, region: us-east-005 }

  # -------------------------------------------------------------------------------------------
  # 8.1 knowledge: the collection this deployment reads
  #
  # AgentCore ships no payload field names. Every name below is here because THIS collection is
  # shaped this way. A collection built by another tool writes a different block.
  #
  # Getting it wrong is loud on purpose. At startup the adapter reads one point and proves every
  # role mapped below is really carried, with the right type. It refuses to open the store if not.
  # A role this collection does not carry is declared with an explicit null (source: null), and
  # the startup proof then skips it.
  # -------------------------------------------------------------------------------------------
  knowledge:
    kind: qdrant
    endpoint: https://qdrant.example.com:6334

    # Whatever this deployment's ingester writes. Point it at an alias if the ingester swaps
    # collections on a rebuild. AgentCore never CREATES a collection. A missing name fails the
    # start.
    collection: kb

    # The named vector every query searches. OMIT it for a collection with one anonymous vector,
    # which is what most Qdrant tooling creates. Startup checks the name exists, because a wrong
    # name would miss every point with no error.
    vector: dense

    # Payload paths for each role. A dotted name walks into a nested struct.
    #   id          the card id. Unmapped, the point's own key stands in.
    #   body        required. The one role the built-in mapping cannot do without.
    #   lexical     the full-text field the required-term leg matches on.
    #   source      the citation label.
    #   locator     where in the source.
    #   authority   an INTEGER. The startup proof knows not to demand a string here.
    fields:
      id: card_id
      body: body
      lexical: text
      source: source.ref
      locator: source.locator
      authority: authority

    # How a turn's facets narrow a search.
    scope:
      # How one facet key becomes a payload path. Flat facets are "{key}". Facets nested under
      # one struct are "facets.{key}". No default. Required as soon as any agent has scoped: true,
      # which is the default, so most documents need it.
      template: "facets.{key}"

      # How a card opts out of exact-match scoping, one facet at a time. A card tagged
      # facets.brand: "*" is reachable from a scope open on any brand. That is where opening
      # hours, returns, and warranty terms belong.
      # Name only REACH facets here. Never name an isolation facet such as a customer id. A
      # wildcard on that would serve one mis-tagged card to every caller, silently.
      # Optional. Leave it out and the emitted filter is unchanged.
      # Configure the wildcard first, then tag the corpus. A "*" tag on a corpus without this
      # block is refused by exact match until the block lands.
      wildcard:
        value: "*"
        facets: [brand, applies_to]

      # The state slots the turn's scope is built from, on top of what the host opens. Each name
      # must be a state: slot with writer: extractor, type: string, an enum:, and no default.
      # A slot nothing has filled yet still appears in the scope, holding the wildcard. Leaving
      # it out would put no condition on that facet at all.
      fromState: [brand, applies_to]

      # The facets a mode: tool agent may narrow its own search by. Each entry is one choice in
      # the search tool's filters argument. The model reads description: and nothing else before
      # it picks a value, so write it for the model. Prefetch agents ignore this block.
      #
      # A filter can only narrow. A facet the host opened or the extractor filled stays as it is.
      # Only a facet holding the wildcard, or one the scope does not carry, is open to the model.
      # A filter that clears no card is dropped, and the search runs once more without it.
      #
      # A key that matches a vocabulary: slot is matched through that slot's fold, so "the 2023
      # LCR" reaches the stored lcr-2023. A key with no such slot is matched exactly as the model
      # wrote it. Prefer a key that has a slot.
      #
      # When the vocabulary is too big for a slot, give the facet a resolve: block. It names a
      # lookup the MODEL runs before it filters: one search under another facet, then the value
      # copied off the card it finds. The host runs nothing itself.
      # via must name another filterable facet, and that one may not resolve in turn. One hop.
      #
      #   - key: lookup
      #     description: "The only value is model-numbers. It returns the model cards and nothing else."
      #   - key: model
      #     description: "One machine and the year it was built, as one tag, such as lcr-2023."
      #     resolve:
      #       via: { key: lookup, value: model-numbers }
      #       query: "<product> model number"
      #       read: the Tag column of the row for the person's year
      filterable:
        - key: applies_to
          description: "The machine the question is about, as one tag, such as ct900 or f63-2019."

    # Link expansion: follow a card's see-also ids to their cards.
    #   field       the payload field that holds the ids.
    #   lookup      uuid5 | direct | filter. filter matches on fields.id and works on any
    #               collection. uuid5 and direct derive the point key from the id, and startup
    #               proves the derivation lands on the point that holds it.
    #   namespace   url | dns | oid | x500 | <guid>. The RFC 4122 names.
    #   prefix      what the ingester hashed in front of the id. Default: empty.
    # Optional. Omit the block to turn link expansion off. Every mode reads fields.id, so a
    # links: block without one is refused.
    links:
      field: see_also
      lookup: uuid5
      namespace: url
      prefix: "kb:"

    # Picks the terms a result MUST contain, on top of vector similarity. none is the only
    # analyzer AgentCore ships: require nothing, rank by vector alone. Anything cleverer is a
    # claim about one corpus's vocabulary, so the framework holds no such rule. Write your own
    # IKnowledgeQueryAnalyzer, register it with options.UseKnowledgeQueryAnalyzers, and name it
    # here.
    analyzer: none

    # How a card's source label is worded, for agents with citations: true. The shipped wording
    # joins source and locator with a comma. Register your own with
    # options.UseKnowledgeCitationFormatters and name it here. Registering under this same name
    # replaces the shipped wording for every agent.
    citation: source-locator

    # The cosine similarity a card must score strictly above, 0 to 1. A question the corpus does
    # not answer then returns nothing instead of its nearest cards. 0 disables the floor.
    # On text-embedding-3-small, 0.25 was too low to tell the two apart; 0.35 was not.
    scoreFloor: 0.35

    # An IKnowledgePointMapper registered with options.UseKnowledgePointMappers. Not used here.
    # Named, it owns the payload shape and replaces the fields: block entirely. The built-in
    # mapping is public (FieldsPointMapper), so a custom mapper can compose it.
    # mapper: my-mapper

  # -------------------------------------------------------------------------------------------
  # 8.2 telemetry: not used here
  #
  # Absent, this host exports nothing. Spans and measurements are still written, and log lines go
  # to the console alone. Uncomment to send all three signals to Grafana Cloud.
  #
  # The endpoint is the OTLP gateway. It takes logs, traces, and metrics at one URL under one
  # basic credential, so there is ONE credential here, not three. It speaks HTTP with protobuf
  # bodies, not gRPC. The adapter sets that for you.
  #
  # Secrets: grafana-cloud-instance-id and grafana-cloud-api-token. Both optional together.
  # Naming the instance id makes the token required. A missing token stops the host at startup.
  # Naming neither exports with no credential, which is what a collector beside this process
  # wants.
  #
  # sources and meters are the built-in .NET names. An EMPTY list is not an absent one: [] listens
  # to AgentCore alone, which buys back the ~1,750 active series a normal replica spends against
  # the 10,000 series ceiling.
  # -------------------------------------------------------------------------------------------
  # telemetry:
  #   kind: grafana
  #   endpoint: https://otlp-gateway-prod-us-east-0.grafana.net/otlp
  #   serviceName: service-voice
  #   exportIntervalMs: 60000    # floor. A smaller number is raised to 60000, never refused.
  #   sources: [Microsoft.AspNetCore, System.Net.Http]
  #   meters:  [Microsoft.AspNetCore.Hosting, Microsoft.AspNetCore.Server.Kestrel, System.Net.Http]


# =============================================================================================
# 9. evaluation: the judge that scores finished turns
# =============================================================================================
#
# A judge never blocks a turn. The sample rate selects a turn that already ended.
evaluation:
  # The share of finished turns to score, 0 to 1.
  # Optional. Default: 0, which scores no turn. A value outside 0 to 1 is a load error.
  sampleRate: 0

  # The model that scores a turn. ref: names a providers.llm[].as value.
  # Optional. Without it, every evaluator that calls no model still runs, and an evaluator that
  # needs a judge returns no value instead of a score.
  # temperature: 0 is what a judge needs. A score that moves for the same input cannot gate a
  # merge. The offline golden set in tests/AgentCore.Evals reads this same key.
  judge: { ref: judge, temperature: 0 }
