# The release path. It builds the container image a deployment runs and pushes it to GHCR.
#
# ci.yml is the gate and holds no secret. This workflow is the opposite: it runs only on a version
# tag of this repository, and it writes. It runs no test, because the tag is cut from a commit that
# already passed ci.yml.
name: publish-image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag of v1.2.3 publishes 1.2.3, 1.2, and 1. A consumer pins the exact version; the shorter
      # tags exist for whoever chooses to float.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/AgentCore.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/arm64 is not built. Fly runs amd64, and a cross-build of the SDK stage under
          # emulation costs more than any consumer of this image has asked for.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
