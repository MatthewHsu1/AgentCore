name: ci

on:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_AIEVAL_TELEMETRY_OPTOUT: true
  EVAL_RESULTS: tests/AgentCore.Evals/bin/Release/net10.0/eval-results

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6334:6334
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/chat-ui/package-lock.json

      - name: Chat UI dependencies
        run: npm ci
        working-directory: demo/chat-ui

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Chat UI tests
        run: npm test
        working-directory: demo/chat-ui

      - name: Unit tests
        run: dotnet test --no-build -c Release
             --filter "FullyQualifiedName!~AgentCore.Evals"
        env:
          AGENTCORE_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=ci
          AGENTCORE_TEST_QDRANT: localhost:6334

      - name: Offline evals
        run: dotnet test --no-build -c Release tests/AgentCore.Evals
             --filter "Category!=Gate"

      - name: Score gate
        run: dotnet test --no-build -c Release tests/AgentCore.Evals
             --filter "Category=Gate"

      - name: Report
        if: always()
        run: dotnet aieval report --path "$EVAL_RESULTS" --output eval-report.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-report.html
          if-no-files-found: warn
