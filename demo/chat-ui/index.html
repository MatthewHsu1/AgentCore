<!doctype html>
<!--
  The endpoint the UI posts turns to. App.tsx falls back to this same value when the attribute is
  absent, so a page built without it still works.
-->
<html lang="en" data-agentcore-endpoint="/v1/chat/completions">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentCore Chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
